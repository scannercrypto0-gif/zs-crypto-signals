name: STAGE04 synthetic GitHub evidence canary (manual gated, no auto execution)
on:
  workflow_dispatch:
    inputs:
      approved_main_sha:
        description: "Exact main SHA reviewed by PM and explicitly approved for one canary"
        required: true
        type: string
      confirmation:
        description: "Type ONE_SYNTHETIC_CANARY_PM_REVIEWED after PM approval"
        required: true
        type: string
      pm_review_confirmed:
        description: "PM independently reviewed workflow permissions and SHA"
        required: true
        default: false
        type: boolean
      zero_cost_verified:
        description: "Owner verified remaining FREE Actions capacity and zero spending"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: stage04-one-synthetic-canary
  cancel-in-progress: false
jobs:
  synthetic-github-evidence-only:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ONE_SYNTHETIC_CANARY_PM_REVIEWED' &&
      inputs.approved_main_sha == github.sha &&
      inputs.pm_review_confirmed == true &&
      inputs.zero_cost_verified == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One synthetic claim/readback/independent restore — no Binance
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          ZS_CANARY_APPROVED_SHA: ${{ inputs.approved_main_sha }}
          ZS_CANARY_CONFIRM: ${{ inputs.confirmation }}
          ZS_CANARY_PM_REVIEW_CONFIRMED: ${{ inputs.pm_review_confirmed && 'YES' || 'NO' }}
          ZS_CANARY_FREE_QUOTA_CONFIRMED: ${{ inputs.zero_cost_verified && 'YES' || 'NO' }}
        run: python -m zs_smart_gate.stage04_canary
