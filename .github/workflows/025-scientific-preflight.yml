name: ORDER-025 engineering regression and private verifier
on:
  pull_request:
    paths:
      - 'tests/test_stage03_order025.py'
      - 'tests/test_order025_private_verify.py'
      - 'scripts/order025-private-verify.py'
      - 'research/order025/**'
      - '.github/workflows/025-scientific-preflight.yml'
permissions:
  contents: read
jobs:
  science-offline:
    name: order025 (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deterministic overlap, counter, private-source-negative tests only
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_*025*.py" -v
          python -m unittest discover -s tests -p "test_stage03_order022.py" -v
          python -m unittest discover -s tests -p "test_setup021.py" -v
