name: Order018 V2 time-bound GitHub-only reproduction
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'research/stage03-018/**'
      - '.github/workflows/018-time-bound-reproduction.yml'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  reproduce-v2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 445d7b04fd834c2dc84ad3d296e406ea357c055e
          path: github017
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing hash-pinned crypto dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-ci-crypto.lock
      - name: Verify pinned017 source, preserve frozen blobs and reproduce V2 evaluation without sockets
        env:
          PYTHONPATH: src
        run: python scripts/restore-018-time-bound.py --github017 github017 --verify-history --output reproduced018.json
