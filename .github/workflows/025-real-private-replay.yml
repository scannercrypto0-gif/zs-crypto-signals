name: ORDER-025 REAL private 010-B archives — manual only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: order025-real-private
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      receipt_sha: ${{ steps.audit.outputs.receipt_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed visibility and branch checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "scannercrypto0-gif/zs-crypto-signals"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          echo "PRIVATE_ONLY_GITHUB_CUSTODY"
      - name: Download previously uploaded original PRIVATE release assets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/order025-source"
          mkdir -p "$tmp"
          gh release download order022-private-010b-2025-v1 --repo "$GITHUB_REPOSITORY" --dir "$tmp"
          PYTHONPATH=src python scripts/order025-github-custody.py verify --download-dir "$tmp" --require-transfer-receipt
          dest="$RUNNER_TEMP/order025-private-run"
          mkdir -p "$dest/verified_5m_archives"
          mv "$tmp"/*.zip "$dest/verified_5m_archives/"
          mv "$tmp"/*.json "$dest/"
          mv "$tmp"/*.sqlite "$dest/"
          test "$(find "$dest/verified_5m_archives" -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 12
          echo "TWELVE_PREVIOUSLY_PINNED_ARCHIVES_TRANSFER_VERIFIED"
      - name: Independent real-data arithmetic replay (not scientific PIT)
        id: audit
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/order025-redacted"
          mkdir -p "$out"
          python scripts/order025-private-verify.py --private-run-dir "$RUNNER_TEMP/order025-private-run" --expected-report-sha 985abecf489ea23d1e46f9aace7152df8cf997cd94cce33dde440bdb34cea5ee --output "$out/audit-redacted.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"order025-redacted"
          audit=out/"audit-redacted.json"
          x=json.loads(audit.read_bytes())
          assert x["status"]=="PRIVATE_OFFLINE_ARITHMETIC_REPRODUCED"
          assert x["source_zip_sha256_verified"]==12
          assert x["report_sha256"]=="985abecf489ea23d1e46f9aace7152df8cf997cd94cce33dde440bdb34cea5ee"
          assert x["historical_pit"]=="HISTORICAL_REPLAY_PIT_UNVERIFIED"
          assert x["statistical_qualification"]=="BLOCKED"
          assert x["publishable"] is False and x["stage05"]=="FULL_HOLD"
          h=hashlib.sha256(audit.read_bytes()).hexdigest()
          r={"schema":"ORDER025_GITHUB_REAL_REPLAY_RECEIPT_V1",
             "source_release":"order022-private-010b-2025-v1",
             "source_original_report_sha256":x["report_sha256"],
             "frozen_manifest_sha256":x["frozen_manifest_sha256"],
             "audit_sha256":h,
             "run_id":os.environ["GITHUB_RUN_ID"],
             "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
             "code_commit_sha":os.environ["GITHUB_SHA"],
             "source_zip_sha256_verified":12,
             "count_reproduction":"PASS_WITH_SHARED_ARCHIVE_PARSER",
             "historical_pit":"UNVERIFIED",
             "scientific_pass":False,
             "market_requests":0,"stage05":"FULL_HOLD"}
          receipt=out/"audit-receipt.json"
          receipt.write_text(json.dumps(r,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("receipt_sha="+hashlib.sha256(receipt.read_bytes()).hexdigest()+"\n")
          print("REAL_SOURCE_ARITHMETIC_REPRODUCED__SCIENTIFIC_PIT_STILL_UNVERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: order025-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order025-redacted/*.json
          if-no-files-found: error
          retention-days: 30
  preserve:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: order025-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order025-redacted
      - name: Verify redacted receipt and preserve as unique PRIVATE release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.verify.outputs.receipt_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "scannercrypto0-gif/zs-crypto-signals"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          cd "$RUNNER_TEMP/order025-redacted"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          files={x.name for x in Path(".").iterdir()}
          assert files=={"audit-redacted.json","audit-receipt.json"}
          rec=Path("audit-receipt.json")
          data=Path("audit-redacted.json")
          assert hashlib.sha256(rec.read_bytes()).hexdigest()==os.environ["EXPECTED_SHA"]
          r=json.loads(rec.read_bytes());a=json.loads(data.read_bytes())
          assert r["audit_sha256"]==hashlib.sha256(data.read_bytes()).hexdigest()
          assert a["status"]=="PRIVATE_OFFLINE_ARITHMETIC_REPRODUCED"
          assert a["statistical_qualification"]=="BLOCKED" and not a["publishable"]
          assert a["stage05"]=="FULL_HOLD" and not r["scientific_pass"]
          print("REDACTED_RECEIPT_INTEGRITY_PASS")
          PY
          tag="order025-private-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$tag" audit-redacted.json audit-receipt.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ORDER025 owner-private audit $GITHUB_RUN_ID" \
            --notes "Original-data arithmetic verified; time-valid historical PIT still UNVERIFIED; no full scientific qualification or Stage05." \
            --prerelease --latest=false
          echo "REDACTED_EVIDENCE_STORED_IN_PRIVATE_GITHUB_RELEASE"
