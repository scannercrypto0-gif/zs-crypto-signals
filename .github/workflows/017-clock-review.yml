name: Order017 offline signed clock review
on:
  pull_request:
    paths:
      - 'src/zs_smart_gate/clock017.py'
      - 'scripts/*017*'
      - 'tests/test_clock017.py'
      - 'research/stage03-017/**'
      - '.github/workflows/017-clock-review.yml'
jobs:
  clock-review:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-ci-crypto.lock
      - name: New clock tests and offline actual signed reply verification
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_clock017.py -v
          python scripts/verify-017-clock.py research/stage03-017/samples.json

