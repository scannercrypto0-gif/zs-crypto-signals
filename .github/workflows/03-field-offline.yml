name: ZS03 bounded field collector offline safety
on:
  pull_request:
    paths:
      - 'src/zs_smart_gate/stage03_windows_field_capture.py'
      - 'src/zs_smart_gate/stage03_field_clock.py'
      - 'src/zs_smart_gate/stage03_field_real_e2e.py'
      - 'src/zs_smart_gate/stage03_field_quick30.py'
      - 'src/zs_smart_gate/stage03_windows_field_review.py'
      - 'tests/test_stage03_windows_field.py'
      - 'tests/test_stage03_field_real_e2e.py'
      - 'tests/test_stage03_field_quick30.py'
      - 'research/order025/run-stage03-field.ps1'
      - 'research/order025/run-stage03-quick30.ps1'
      - '.github/workflows/03-field-offline.yml'
permissions:
  contents: read
jobs:
  field-offline-guard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only field collector safety tests; NO market request
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_stage03_windows_field.py" -v
      - name: One real-adapter E2E contract fixture (offline only)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_stage03_field_real_e2e.py" -v
      - name: Quick30 prospective research E2E source adapter tests (offline)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_stage03_field_quick30.py" -v
