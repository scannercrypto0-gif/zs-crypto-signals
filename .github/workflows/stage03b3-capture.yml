name: STAGE-03B3 finite prospective PIT source capture (manual only)
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "One frozen Spot USDT symbol, one execution per slot ONLY"
        required: true
        type: choice
        options: [BTCUSDT, ETHUSDT, AAVEUSDT]
      horizon:
        description: "Declared parent horizon"
        required: true
        type: choice
        options: [INTRADAY, SWING]
      slot:
        description: "Fixed event label; do NOT rerun or resample after close"
        required: true
        type: choice
        options: [I1, I2, S1, S2]
permissions:
  contents: read
jobs:
  finite-one-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exactly one post-close window with at most eight physical Binance GET attempts
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python -m zs_smart_gate.stage03b3_capture --live --symbol ${{ inputs.symbol }} --horizon ${{ inputs.horizon }} --slot ${{ inputs.slot }} > evidence/${{ inputs.symbol }}_${{ inputs.slot }}.json
          code=$?
          set -e
          python -c "import json,glob; x=json.load(open(glob.glob('evidence/*.json')[0])); print(json.dumps({'study_id':x['study_id'],'symbol':x['symbol'],'slot':x['slot'],'status':x['status'],'source_sha256':x.get('source_payload_sha256'),'telemetry':x.get('telemetry'),'reason':x.get('reason'),'decision_at':x.get('decision_at')},sort_keys=True))"
          exit $code
      - name: Seven-day transient PIT provenance, not permanent Stage04 storage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03b3-${{ inputs.symbol }}-${{ inputs.slot }}
          path: evidence/*.json
          if-no-files-found: warn
          retention-days: 7
