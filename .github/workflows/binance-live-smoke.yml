name: Binance LIVE public-market smoke (opt-in, isolated)
on:
  workflow_dispatch:
  push:
    branches: [foundation-001-core]
jobs:
  live-market-data:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[binance-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Opt-in read-only Binance Spot live smoke (one symbol; no API keys)
        env:
          PYTHONPATH: src
        run: python -m zs_smart_gate.binance_live --live --symbol BTCUSDT
