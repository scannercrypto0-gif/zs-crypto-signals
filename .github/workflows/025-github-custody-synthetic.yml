name: ORDER025 Github private custody — synthetic gates only
on:
  pull_request:
    paths:
      - 'scripts/order025-github-custody.py'
      - 'tests/test_order025_github_custody.py'
      - 'research/order025/github-private-custody.md'
      - '.github/workflows/025-real-private-replay.yml'
      - '.github/workflows/025-github-custody-synthetic.yml'
permissions:
  contents: read
jobs:
  offline-custody-gates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic local archive SHA and private source rejection only
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_order025_github_custody.py" -v
          python -m unittest discover -s tests -p "test_order025_private_verify.py" -v
