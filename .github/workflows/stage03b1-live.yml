name: STAGE-03B1 bounded Binance LIVE MTF evidence (opt-in)
on:
  workflow_dispatch:
  push:
    branches: [stage-03b1-live-mtf-research]
permissions:
  contents: read
jobs:
  bounded-public-mtf:
    # No automatic recurring polling; only explicit final-head marker or dispatch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mtf-live]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        horizon: [INTRADAY, SWING]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One BTCUSDT Spot read-only closed parent plus exact children
        env:
          PYTHONPATH: src
        run: python -m zs_smart_gate.stage03b1_live --live --symbol BTCUSDT --horizon ${{ matrix.horizon }}
