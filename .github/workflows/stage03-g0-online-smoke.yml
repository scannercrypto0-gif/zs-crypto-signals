name: STAGE-03 G0 bounded public online integration smoke (manual only)
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: One BTCUSDT horizon only; no scheduled requests
        type: choice
        default: INTRADAY
        required: true
        options:
          - INTRADAY
          - SWING
permissions:
  contents: read
concurrency:
  group: stage03-g0-bounded-public-manual-only
  cancel-in-progress: false
jobs:
  g0-online-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One public BTCUSDT GET integration; no production access
        env:
          PYTHONPATH: src
        run: python -m zs_smart_gate.stage03_g0_online_smoke --live --horizon ${{ inputs.horizon }}
