name: Order020-A offline field engine and native parser preflight
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'research/stage03-020/**'
      - 'requirements-020.lock'
      - '.github/workflows/020-field-preflight.yml'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2f4c6266fb88893dbb1f2e1805f28afdacca1bbb
          path: github019
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-020.lock
      - name: Only synthetic capture, fault controls and pinned real parser; no source sockets
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_pilot020.py -v
          python scripts/preflight-020-offline.py --github019 github019 --output preflight020.json
