name: ORDER-022 offline historic-source inventory and frozen replay tests
on:
  pull_request:
    paths:
      - 'src/zs_smart_gate/stage03_order022.py'
      - 'scripts/order022-offline-history.py'
      - 'tests/test_stage03_order022.py'
      - 'research/order022/**'
      - '.github/workflows/022-offline-historical.yml'
permissions:
  contents: read
jobs:
  historical-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline frozen-manifest and synthetic source-negative cases
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_stage03_order022.py -v
          python scripts/order022-offline-history.py inventory --data-dir research/order022/no-raw-market-data --output order022-missing-inventory.json
      - name: Retain non-sensitive negative source inventory only
        uses: actions/upload-artifact@v4
        with:
          name: order022-absent-private-data-${{ matrix.os }}-py${{ matrix.python-version }}
          path: order022-missing-inventory.json
          retention-days: 14
