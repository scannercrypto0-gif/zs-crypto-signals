name: FOUNDATION-001 offline unit and integration tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'README.md'
      - 'ZS_SMART_GATE_MASTER.md'
      - 'pyproject.toml'
      - 'docs/**'
      - '.github/workflows/**'
      - 'requirements-ci-crypto.lock'
      - 'research/**'
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned cryptographic dependencies with SHA-256 verification
        run: python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-ci-crypto.lock
      - name: Run all offline unit and integration tests (network not required)
        env:
          PYTHONPATH: src
        run: python scripts/run-offline-ci.py
      - name: Validate offline Windows TaskScheduler definition and lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          python -m venv .runner-test-venv
          ./tests/windows-runner.Tests.ps1 -PythonPath (Resolve-Path .runner-test-venv/Scripts/python.exe).Path
