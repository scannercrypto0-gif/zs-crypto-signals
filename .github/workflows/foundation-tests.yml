name: FOUNDATION-001 offline unit and integration tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'ZS_SMART_GATE_MASTER.md'
      - 'pyproject.toml'
      - 'docs/**'
      - '.github/workflows/**'
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all offline unit and integration tests (network not required)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
